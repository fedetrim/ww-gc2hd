name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.8"}       # the oldest version the tool supports; the newest
                                                    # runner image that still has it
          - {os: ubuntu-latest, python: "3.x"}
          - {os: macos-latest, python: "3.x"}
          - {os: windows-latest, python: "3.x"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Samples match their checksums
        run: python scripts/fetch_samples.py --check
      - name: Unit tests
        run: python -m unittest -v tests.test_wwsave

  # One check to require for merging, whatever the matrix above holds.
  tests:
    if: always()
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.unit.result }}" = success
